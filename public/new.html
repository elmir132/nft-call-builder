<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New collections · NFT Call Builder</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site">
    <a class="brand" href="/"><img src="img/logo.png" alt="">NFT Call Builder</a>
    <nav class="tabs" aria-label="Pages">
      <a href="/">Call builder</a>
      <a href="new.html" aria-current="page">New</a>
      <a href="watchlist.html">Watchlist</a>
      <a href="wallet.html">Wallet</a>
    </nav>
    <div class="ticker" id="ticker" aria-live="polite">Loading market data…</div>
  </header>

  <main>
    <h1>New collections</h1>
    <p class="lede">The latest collections created on Magic Eden, and upcoming or recent launchpad mints. Pick one to start a call.</p>

    <div class="segmented" role="tablist" aria-label="Feed">
      <button type="button" role="tab" id="tab-new" aria-selected="true" data-feed="new">Just created</button>
      <button type="button" role="tab" id="tab-launchpad" aria-selected="false" data-feed="launchpad">Launchpad</button>
    </div>
    <div id="notice" class="notice error" hidden></div>
    <div id="cards" class="cards" aria-live="polite"></div>
    <p class="field-note" id="footnote"></p>
  </main>

  <script type="module" src="js/new.js"></script>
</body>
</html>
